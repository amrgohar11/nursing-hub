<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | Nursing Hub</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { display: flex; justify-content: center; align-items: center; height: 100vh; background: var(--bg); margin: 0; transition: background 0.3s; }
    .login-box { background: var(--white); padding: 40px; border-radius: 20px; box-shadow: var(--shadow-xl); width: 100%; max-width: 400px; text-align: center; border-top: 5px solid var(--primary); transition: background 0.3s, box-shadow 0.3s; }
    .login-box h2 { color: var(--primary-dark); margin-bottom: 25px; font-size: 28px; }
    .login-box input { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 10px; border: 2px solid var(--border); font-family: inherit; background: var(--bg); color: var(--text); outline: none; transition: 0.3s; }
    .login-box input:focus { border-color: var(--primary); }
    .login-box button { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .login-box button:hover { background: var(--primary-dark); }
    #error-msg { color: red; margin-top: 15px; font-weight: bold; display: none; }
    .theme-toggle-btn { position: fixed; top: 20px; left: 20px; }
  </style>
</head>
<body>

  <button id="theme-toggle" class="theme-toggle-btn" title="تبديل الوضع الليلي">🌙</button>

  <div class="login-box">
    <h2>🔐 تسجيل الدخول</h2>
    <form id="login-form">
      <input type="email" id="email" placeholder="الإيميل" required>
      <input type="password" id="password" placeholder="الباسورد" required>
      <button type="submit">دخول</button>
    </form>
    <p id="error-msg"></p>
  </div>

  <script type="module" src="login.js"></script>
</body>
</html>
