    const PAGE = 60;
    const T = DATA.trim().split('\n').map(l => { const [c, en, ar, n = ''] = l.split('|'); return {c, en: en.trim(), ar, n}; })
      .sort((a, b) => a.en.localeCompare(b.en));
    const $ = id => document.getElementById(id);
    let cat = 'all', q = '', shown = PAGE;

    const chips = $('chips');
    [['all', 'الكل'], ...Object.entries(CATS)].forEach(([k, label]) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.textContent = label; b.dataset.cat = k;
      b.setAttribute('aria-pressed', k === 'all');
      chips.appendChild(b);
    });
    chips.addEventListener('click', e => {
      const b = e.target.closest('.chip'); if (!b) return;
      cat = b.dataset.cat; shown = PAGE;
      chips.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === b));
      render();
    });
    $('termSearch').addEventListener('input', e => { q = e.target.value.trim().toLowerCase(); shown = PAGE; render(); });
    $('moreBtn').addEventListener('click', () => { shown += PAGE; render(); });

    function render() {
      const list = T.filter(t => (cat === 'all' || t.c === cat) && (!q || (t.en + ' ' + t.ar + ' ' + t.n).toLowerCase().includes(q)));
      const frag = document.createDocumentFragment();
      list.slice(0, shown).forEach(t => {
        const card = document.createElement('article'); card.className = 'term-card';
        const h = document.createElement('h3'); h.textContent = t.en;
        const p = document.createElement('p'); p.textContent = t.ar;
        const s = document.createElement('small'); s.textContent = t.n;
        card.append(h, p, s); frag.appendChild(card);
      });
      $('termsGrid').replaceChildren(frag);
      $('termsEmpty').style.display = list.length ? 'none' : 'block';
      $('moreBtn').style.display = list.length > shown ? 'block' : 'none';
      $('termsCount').textContent = list.length + ' مصطلح';
    }
    render();
  </script>
