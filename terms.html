<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المصطلحات الطبية | Nursing Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="glass-nav">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">🩺 Nursing Hub</a>
      <a href="index.html" style="font-weight: 700; color: var(--primary);">&rarr; الرئيسية</a>
    </div>
  </header>

  <main class="container">
    <h1 class="section-title">📚 المصطلحات الطبية</h1>
    <input type="text" id="term-search" placeholder="ابحث عن مصطلح..." style="width: 100%; padding: 15px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 30px; font-size: 16px;">

    <div class="grid" id="terms-grid">
      <div class="subject-card"><h3 class="subject-name-ar">Hypertension</h3><p class="subject-desc">ارتفاع ضغط الدم</p></div>
      <div class="subject-card"><h3 class="subject-name-ar">Tachycardia</h3><p class="subject-desc">سرعة ضربات القلب</p></div>
      <div class="subject-card"><h3 class="subject-name-ar">Dyspnea</h3><p class="subject-desc">صعوبة التنفس</p></div>
      <div class="subject-card"><h3 class="subject-name-ar">Edema</h3><p class="subject-desc">تورم (احتباس سوائل)</p></div>
      <div class="subject-card"><h3 class="subject-name-ar">Hemorrhage</h3><p class="subject-desc">نزيف</p></div>
      <div class="subject-card"><h3 class="subject-name-ar">Asphyxia</h3><p class="subject-desc">اختناق</p></div>
      <div class="subject-card"><h3 class="subject-name-ar">Analgesic</h3><p class="subject-desc">مسكن للألم</p></div>
      <div class="subject-card"><h3 class="subject-name-ar">Antibiotic</h3><p class="subject-desc">مضاد حيوي</p></div>
    </div>
  </main>

  <script>
    document.getElementById('term-search').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const cards = document.querySelectorAll('#terms-grid .subject-card');
      cards.forEach(card => {
        card.style.display = card.textContent.toLowerCase().includes(term) ? 'block' : 'none';
      });
    });
  </script>
</body>
</html>
