<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عرض المحاضرة | Nursing Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="height: 100vh; display: flex; flex-direction: column; overflow: hidden;">

  <!-- الهيدر -->
  <header class="glass-nav" style="flex-shrink: 0;">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">🩺 Nursing Hub</a>
      <div class="nav-links">
        <a id="back-link" href="#" style="font-weight: 700; color: var(--primary);">&rarr; العودة للمادة</a>
        <button id="theme-toggle" class="theme-toggle-btn" title="تبديل الوضع الليلي">🌙</button>
      </div>
    </div>
  </header>

  <!-- عارض المحاضرة -->
  <main style="flex-grow: 1; background: var(--border); padding: 15px;">
    <iframe 
      id="lecture-frame" 
      src="" 
      style="width: 100%; height: 100%; border: none; border-radius: 15px; background: white; box-shadow: 0 4px 15px rgba(0,0,0,0.1);"
      sandbox="allow-same-origin allow-scripts allow-popups allow-forms"
    ></iframe>
  </main>

  <script type="module">
    import { db } from './firebase-config.js';
    import { doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const urlParams = new URLSearchParams(window.location.search);
    const fileName = urlParams.get('file');
    const subjectId = urlParams.get('subjectId');
    const lectureId = urlParams.get('id'); // ضفنا الـ ID هنا

    const frame = document.getElementById('lecture-frame');
    const backLink = document.getElementById('back-link');

    if (fileName) {
      frame.src = `lectures/${fileName}`;
      
      // === كود زيادة عدد المشاهدات ===
      if (subjectId && lectureId) {
        const lectureRef = doc(db, "subjects", subjectId, "lectures", lectureId);
        updateDoc(lectureRef, {
          views: increment(1)
        }).catch((err) => console.log("Error updating views:", err));
      }

    } else {
      frame.src = 'data:text/html;charset=utf-8,<h1 style="text-align:center; margin-top:50px; font-family:sans-serif;">لم يتم العثور على ملف المحاضرة</h1>';
    }

    if (subjectId) {
      backLink.href = `subject.html?id=${subjectId}`;
    } else {
      backLink.href = `index.html`;
    }

    // === كود الوضع الليلي ===
    const themeToggleBtn = document.getElementById('theme-toggle');
    const currentTheme = localStorage.getItem('theme') || 'light';

    document.documentElement.setAttribute('data-theme', currentTheme);

    if (themeToggleBtn) {
      themeToggleBtn.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
      
      themeToggleBtn.addEventListener('click', () => {
        const theme = document.documentElement.getAttribute('data-theme');
        const newTheme = theme === 'dark' ? 'light' : 'dark';
        
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        
        themeToggleBtn.textContent = newTheme === 'dark' ? '☀️' : '🌙';
      });
    }
  </script>
</body>
</html>
