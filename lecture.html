<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عرض المحاضرة | Nursing Hub</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .lecture-container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background-color: var(--bg);
    }
    
    .lecture-header {
      background: var(--white);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .lecture-content {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      padding: 15px;
      gap: 20px;
    }

    .iframe-wrapper {
      background: var(--white);
      border-radius: 15px;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      width: 100%;
      height: 70vh; /* ارتفاع ثابت كبير */
      min-height: 500px;
    }

    .lecture-iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .comments-section {
      background: var(--white);
      padding: 20px;
      border-radius: 15px;
      box-shadow: var(--shadow-md);
    }

    .comment-card {
      background: var(--bg);
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 10px;
      border-right: 4px solid var(--primary);
    }

    .comment-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: bold;
      color: var(--primary-dark);
    }

    .comment-text {
      font-size: 14px;
      color: var(--text);
      line-height: 1.6;
    }

    .star-rating {
      color: #f59e0b;
      font-size: 22px;
      cursor: pointer;
      margin-left: 2px;
    }

    .action-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    .action-btn:hover { background: var(--primary-dark); }

    .hidden { display: none; }

    @media (max-width: 768px) {
      .iframe-wrapper {
        height: 60vh;
        min-height: 400px;
      }
    }
  </style>
</head>
<body>

  <div class="lecture-container">
    
    <!-- الهيدر -->
    <header class="lecture-header">
      <a href="index.html" class="nav-logo" style="font-size: 20px; font-weight: 900; color: var(--primary-dark);">🩺 Nursing Hub</a>
      <div style="display: flex; gap: 15px; align-items: center;">
        <a id="back-link" href="#" style="font-weight: 700; color: var(--primary);">&rarr; العودة للمادة</a>
        <button id="theme-toggle" class="theme-toggle-btn" title="تبديل الوضع الليلي">🌙</button>
      </div>
    </header>

    <!-- المحتوى -->
    <main class="lecture-content">
      
      <!-- الملخص (iframe) -->
      <div class="iframe-wrapper">
        <iframe id="lecture-frame" class="lecture-iframe" src="" sandbox="allow-same-origin allow-scripts allow-popups allow-forms"></iframe>
      </div>

      <!-- زرار خلصت المذاكرة -->
      <div style="text-align: center; margin-bottom: 10px;">
        <button id="complete-btn" class="action-btn">✅ خلصت المذاكرة</button>
        <p id="completion-msg" style="color: green; font-weight: bold; margin-top: 10px; display: none;">تم تسجيل الإنجاز!</p>
      </div>

      <!-- قسم التعليقات -->
      <div class="comments-section" id="comments-section">
        <h3 style="margin-bottom: 15px; color: var(--primary-dark);">التعليقات والتقييم</h3>
        
        <div id="add-comment-form">
          <div style="margin-bottom: 15px; text-align: center;">
            <span style="font-size: 16px; font-weight: bold; margin-left: 10px;">تقييمك:</span>
            <span class="star-rating" data-value="1">★</span>
            <span class="star-rating" data-value="2">★</span>
            <span class="star-rating" data-value="3">★</span>
            <span class="star-rating" data-value="4">★</span>
            <span class="star-rating" data-value="5">★</span>
          </div>
          <textarea id="comment-text" placeholder="اكتب تعليقك هنا..." style="width: 100%; padding: 15px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 10px; font-family: inherit; font-size: 15px; min-height: 80px;"></textarea>
          <button id="submit-comment" class="action-btn" style="width: 100%; background: var(--primary-dark);">إرسال التعليق</button>
        </div>
        
        <div id="comments-list" style="margin-top: 20px;">
          <!-- التعليقات هتظهر هنا -->
        </div>
      </div>

    </main>

  </div>

  <!-- الحماية -->
  <script type="module" src="guard.js"></script>
  
  <script type="module">
    import { auth, db } from './firebase-config.js';
    import { doc, getDoc, updateDoc, increment, arrayUnion, collection, addDoc, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const urlParams = new URLSearchParams(window.location.search);
    const fileName = urlParams.get('file');
    const subjectId = urlParams.get('subjectId');
    const lectureId = urlParams.get('id');
    
    let currentUser = null;
    let currentRating = 5;

    onAuthStateChanged(auth, (user) => {
      if (user) currentUser = user;
    });

    const frame = document.getElementById('lecture-frame');
    const backLink = document.getElementById('back-link');

    if (fileName) {
      frame.src = `lectures/${fileName}`;
      if (subjectId && lectureId) {
        const lectureRef = doc(db, "subjects", subjectId, "lectures", lectureId);
        updateDoc(lectureRef, { views: increment(1) }).catch(e => console.log(e));
        loadComments(subjectId, lectureId);
        checkCompletion(subjectId, lectureId);
      }
    } else {
      frame.src = 'data:text/html;charset=utf-8,<h1 style="text-align:center; margin-top:50px;">لم يتم العثور على الملف</h1>';
    }

    if (subjectId) backLink.href = `subject.html?id=${subjectId}`;
    else backLink.href = `index.html`;

    // === نظام التقييم بالنجوم ===
    document.querySelectorAll('.star-rating').forEach(star => {
      star.addEventListener('click', (e) => {
        currentRating = parseInt(e.target.getAttribute('data-value'));
        document.querySelectorAll('.star-rating').forEach(s => s.style.color = '#ccc');
        for (let i = 1; i <= currentRating; i++) {
          document.querySelector(`.star-rating[data-value="${i}"]`).style.color = '#f59e0b';
        }
      });
      star.style.color = '#f59e0b';
    });

    // === إضافة تعليق ===
    document.getElementById('submit-comment').addEventListener('click', async () => {
      const text = document.getElementById('comment-text').value.trim();
      if (!text || !currentUser) return alert('اكتب تعليقك أولاً!');

      try {
        const commentsRef = collection(db, "subjects", subjectId, "lectures", lectureId, "comments");
        await addDoc(commentsRef, {
          userId: currentUser.uid,
          userName: currentUser.email.split('@')[0],
          text: text,
          rating: currentRating,
          createdAt: new Date()
        });
        document.getElementById('comment-text').value = '';
        loadComments(subjectId, lectureId);
      } catch (error) {
        alert('حدث خطأ أثناء إضافة التعليق');
      }
    });

    // === تحميل التعليقات ===
    async function loadComments(subId, lecId) {
      const list = document.getElementById('comments-list');
      list.innerHTML = '<p>جاري التحميل...</p>';
      
      try {
        const q = query(collection(db, "subjects", subId, "lectures", lecId, "comments"), orderBy("createdAt", "desc"));
        const snapshot = await getDocs(q);
        list.innerHTML = '';
        
        if (snapshot.empty) {
          list.innerHTML = '<p style="color:#666; font-size:14px; text-align:center;">لا توجد تعليقات بعد. كن أول من يعلق!</p>';
          return;
        }

        snapshot.forEach(docSnap => {
          const data = docSnap.data();
          const div = document.createElement('div');
          div.className = 'comment-card';
          div.innerHTML = `
            <div class="comment-header">
              <span>👤 ${data.userName}</span>
              <span style="color:#f59e0b;">${'★'.repeat(data.rating)}</span>
            </div>
            <div class="comment-text">${data.text}</div>
          `;
          list.appendChild(div);
        });
      } catch (e) {
        list.innerHTML = '<p style="color:red; text-align:center;">حدث خطأ في تحميل التعليقات</p>';
      }
    }

    // === نظام "خلصت المذاكرة" ===
    document.getElementById('complete-btn').addEventListener('click', async () => {
      if (!currentUser) return;
      try {
        const studentRef = doc(db, "students", currentUser.uid);
        await updateDoc(studentRef, {
          completedLectures: arrayUnion(lectureId)
        });
        document.getElementById('complete-btn').style.display = 'none';
        document.getElementById('completion-msg').style.display = 'block';
        await checkAndAwardBadges(currentUser.uid);
      } catch (error) {
        alert('حدث خطأ!');
      }
    });

    async function checkCompletion(subId, lecId) {
      if (!currentUser) return;
      const studentDoc = await getDoc(doc(db, "students", currentUser.uid));
      if (studentDoc.exists()) {
        const completed = studentDoc.data().completedLectures || [];
        if (completed.includes(lecId)) {
          document.getElementById('complete-btn').style.display = 'none';
          document.getElementById('completion-msg').style.display = 'block';
        }
      }
    }

    async function checkAndAwardBadges(uid) {
      const studentDoc = await getDoc(doc(db, "students", uid));
      if (studentDoc.exists()) {
        const completed = studentDoc.data().completedLectures || [];
        let newBadges = [];
        if (completed.length >= 1) newBadges.push('🌱 مبتدئ');
        if (completed.length >= 3) newBadges.push('📚 مذاكر');
        if (completed.length >= 5) newBadges.push('🏆 متفوق');
        
        if (newBadges.length > 0) {
          await updateDoc(doc(db, "students", uid), { badges: newBadges });
        }
      }
    }
  </script>
</body>
</html>
