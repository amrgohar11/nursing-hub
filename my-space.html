<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مساحتي | Nursing Hub</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: var(--bg); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    @media (max-width: 768px) { .grid2 { grid-template-columns: 1fr; } }
    .card { background: var(--white); padding: 24px; border-radius: 20px; box-shadow: var(--shadow-md); border: 1px solid var(--border); margin-bottom: 20px; }
    .grid2 .card { margin-bottom: 0; }
    .card h2 { font-size: 18px; color: var(--primary-dark); margin-bottom: 14px; }
    .big { font-size: 44px; font-weight: 900; color: var(--primary-dark); line-height: 1; }
    .muted { color: var(--text-muted); font-size: 13px; }
    .bar { width: 100%; height: 10px; background: var(--border); border-radius: 6px; overflow: hidden; margin: 8px 0; }
    .bar > div { height: 100%; background: linear-gradient(90deg, var(--primary), var(--success)); transition: width .6s; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .row:last-child { border-bottom: none; }
    .row a { color: var(--text); text-decoration: none; font-weight: 700; flex: 1; }
    .row small { display: block; color: var(--text-muted); font-weight: 400; margin-top: 3px; }
    .btn { padding: 10px 16px; border-radius: 10px; border: none; background: var(--primary); color: #fff; font-weight: 800; cursor: pointer; font-family: inherit; }
    .btn.ghost { background: var(--primary-light); color: var(--primary-dark); }
    .btn.danger { background: #fef2f2; color: #ef4444; padding: 6px 10px; }
    .field { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-family: inherit; }
    .badges { display: flex; flex-wrap: wrap; gap: 8px; }
    .badge-chip { background: var(--primary-light); color: var(--primary-dark); padding: 6px 12px; border-radius: 20px; font-weight: 800; font-size: 13px; }
    .me { background: var(--primary-light); border-radius: 10px; padding-inline: 8px; }
    .empty { color: var(--text-muted); text-align: center; padding: 14px; font-size: 14px; }
  </style>
</head>
<body>
  <header class="glass-nav">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">🩺 Nursing Hub</a>
      <div class="nav-links">
        <a href="index.html">الرئيسية</a>
        <button id="theme-toggle" class="theme-toggle-btn" title="الوضع الليلي">🌙</button>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top:20px;">
    <div class="grid2">
      <div class="card">
        <h2>🔥 أيام المذاكرة المتتالية</h2>
        <div class="big" id="streak-now">0</div>
        <p class="muted" id="streak-best"></p>
      </div>
      <div class="card">
        <h2>🎯 هدف النهاردة</h2>
        <div class="muted">عدد المحاضرات في اليوم:
          <select id="goal-select" class="field">
            <option value="0">بدون هدف</option><option value="1">1</option><option value="2">2</option>
            <option value="3">3</option><option value="4">4</option><option value="5">5</option>
          </select>
        </div>
        <div class="bar"><div id="goal-bar" style="width:0%"></div></div>
        <p class="muted" id="goal-text"></p>
      </div>
    </div>

    <div class="card"><h2>🏅 شاراتي</h2><div class="badges" id="badges"></div></div>

    <div class="card">
      <h2>🔔 الإشعارات</h2>
      <p class="muted" id="push-hint" style="margin-bottom:10px;"></p>
      <button class="btn" id="push-btn">تفعيل الإشعارات</button>
    </div>

    <div class="card">
      <h2>⭐ المفضلة</h2>
      <div id="bookmarks"></div>
    </div>

    <div class="card">
      <h2>📝 ملاحظاتي</h2>
      <div id="notes"></div>
    </div>

    <div class="card">
      <h2>🏆 لوحة الشرف</h2>
      <p class="muted" style="margin-bottom:10px;">اختيارية — بتظهر باسم مستعار بس، ومحدش بيشوف إيميلك أو اسمك.</p>
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;">
        <input id="nick" class="field" maxlength="20" placeholder="اسم مستعار (2-20 حرف)">
        <button class="btn" id="board-toggle">انضم للوحة الشرف</button>
      </div>
      <p id="board-msg" class="muted"></p>
      <div id="board"></div>
    </div>
  </main>

  <script type="module" src="guard.js"></script>
  <script type="module" src="my-space.js"></script>
</body>
</html>
