<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حسابي | Nursing Hub</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .dashboard-card { background: var(--white); padding: 40px; border-radius: 24px; box-shadow: var(--shadow-lg); max-width: 600px; margin: 50px auto; text-align: center; border-top: 6px solid var(--primary); }
    .status-badge { display: inline-block; padding: 10px 20px; border-radius: 50px; font-weight: bold; margin-bottom: 20px; }
    .status-active { background: #d1fae5; color: #065f46; }
    .status-expired { background: #fee2e2; color: #991b1b; }
    .info-row { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid var(--border); font-size: 16px; }
    .info-row span:first-child { color: var(--text-muted); }
    .info-row span:last-child { font-weight: bold; color: var(--primary-dark); }
    .action-btn { display: block; width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 30px; text-decoration: none; }
    .action-btn:hover { background: var(--primary-dark); }
    .hidden { display: none; }
    .badges-container { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
    .badge-item { background: var(--primary-light); color: var(--primary-dark); padding: 6px 15px; border-radius: 20px; font-weight: bold; font-size: 14px; }
  </style>
</head>
<body>

  <header class="glass-nav">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">🩺 Nursing Hub</a>
      <div class="nav-links">
        <a href="index.html">الرئيسية</a>
        <a href="#" id="logout-btn" style="color: #ef4444;">تسجيل خروج</a>
      </div>
    </div>
  </header>

  <div class="dashboard-card" id="dashboard">
    <h2>مرحباً بك، <span id="student-name"></span></h2>
    <div id="status-container"></div>
    
    <div id="details-container" class="hidden">
      <div class="info-row">
        <span>تاريخ انتهاء الاشتراك</span>
        <span id="expiry-date"></span>
      </div>
      <div class="info-row">
        <span>الحالة</span>
        <span id="status-text"></span>
      </div>
    </div>

    <!-- قسم الشارات -->
    <div style="margin-top: 25px; text-align: right;">
      <h3 style="color: var(--primary-dark); font-size: 16px; margin-bottom: 10px;">🏅 شاراتك</h3>
      <div id="badges-container" class="badges-container">
        <span style="color: #666; font-size: 14px;">جاري تحميل الشارات...</span>
      </div>
    </div>
    
    <a href="index.html" class="action-btn">تصفح المحاضرات</a>
    <a href="https://wa.me/201061863235?text=أريد%20تجديد%20اشتراكي" target="_blank" id="renew-btn" class="action-btn" style="background: var(--primary-dark); display: none;">تجديد الاشتراك (واتساب)</a>
  </div>

  <!-- الحماية -->
  <script type="module" src="guard.js"></script>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
