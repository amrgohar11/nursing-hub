<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المحاضرات المفضلة | Nursing Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="glass-nav">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">🩺 Nursing Hub</a>
      <a href="index.html" style="font-weight: 700; color: var(--primary);">&rarr; الرئيسية</a>
    </div>
  </header>

  <main class="container">
    <h1 class="section-title">❤️ المحاضرات المفضلة</h1>
    <div id="bookmarks-grid" class="grid">
      <p style="grid-column: 1/-1; text-align: center; color: #64748b;">جاري تحميل المحاضرات...</p>
    </div>
  </main>

  <script>
    const grid = document.getElementById('bookmarks-grid');
    const bookmarks = [];

    // جمع كل المحاضرات المحفوظة من localStorage
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key.startsWith('bookmark_')) {
        bookmarks.push(JSON.parse(localStorage.getItem(key)));
      }
    }

    if (bookmarks.length === 0) {
      grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #64748b; padding: 40px;">لسه مفيش محاضرات محفوظة. افتح أي محاضرة ودوس "حفظ".</p>';
    } else {
      grid.innerHTML = '';
      bookmarks.forEach(bm => {
        const card = document.createElement('a');
        card.href = `lecture.html?subjectId=${bm.subjectId}&file=${bm.fileName}&id=${bm.id}`;
        card.className = 'subject-card';
        card.innerHTML = `
          <div style="font-size: 30px; margin-bottom: 10px;">📄</div>
          <h3 class="subject-name-ar">محاضرة محفوظة</h3>
          <p style="color: var(--text-muted); font-size: 14px;">اضغط لفتح المحاضرة</p>
        `;
        grid.appendChild(card);
      });
    }
  </script>
</body>
</html>
